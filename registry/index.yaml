# The Tome source registry — an index of ready-made source configurations.
#
# It contains CONFIGURATION, NEVER CONTENT. Tome does not host or redistribute
# anyone's documentation; a user's own machine fetches it from the origin.
# That is what keeps the legal posture clean (RISK-011, SPIKE-010), and it is
# the one property here that must never be traded for convenience.
#
# `verified` is the date the verification job last confirmed the config still
# produces pages against the live site. A stale date is the signal that a
# scraper has rotted (RISK-003) — the whole point of the field.
