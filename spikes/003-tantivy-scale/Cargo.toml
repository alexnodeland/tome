# SPIKE-003 — Tantivy memory and latency at 100k pages.
#
# Its own workspace, like `fuzz/`, and excluded from the root one. Tantivy is
# not a product dependency yet — S2-2 is where it enters `tome-core` properly,
# with a cargo-deny review of its tree. A spike must not put a large
# dependency into the product build to answer a question about whether to
# adopt it.
#
# Remove this directory when S2-2 lands; the write-up in docs/spikes/ is the
# part that outlives it.
[workspace]

[package]
name = "spike003"
description = "SPIKE-003: Tantivy memory and latency at documentation scale."
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tantivy = "0.26"

# The numbers are the deliverable, so measure the build people would ship.
[profile.release]
opt-level = 3
