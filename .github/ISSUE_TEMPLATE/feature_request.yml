name: Feature request
description: Suggest something Tome should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem, not the solution. What do you do today instead?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: nongoal
    attributes:
      label: Have you checked the non-goals?
      description: "`docs/PRD.md` § Non-Goals lists what Tome deliberately will not do."
      options:
        - "Yes, and this is not one of them"
        - "This is arguably a non-goal, and here's why it should change"
    validations: { required: true }
