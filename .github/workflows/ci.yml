# Continuous Integration Pipeline
# Runs on every push and pull request to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # === Lint Job ===
  lint:
    name: Lint
    runs-on: macos-14 # M1 Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # Rust linting
      - name: Rust Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      # TypeScript/Svelte linting
      - name: ESLint
        run: npm run lint

      - name: Prettier Check
        run: npm run format:check

      - name: TypeScript Check
        run: npm run typecheck

  # === Rust Tests Job ===
  test-rust:
    name: Test Rust
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          cd src-tauri
          cargo llvm-cov --all-features --lcov --output-path ../lcov-rust.info

      - name: Check coverage threshold
        run: |
          cd src-tauri
          cargo llvm-cov --all-features --fail-under 80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov-rust.info
          flags: rust
          fail_ci_if_error: false

  # === JavaScript Tests Job ===
  test-js:
    name: Test JavaScript
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: javascript
          fail_ci_if_error: false

  # === Build Job ===
  build:
    name: Build
    runs-on: macos-14
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          # Skip signing in CI
          TAURI_PRIVATE_KEY: ""
          TAURI_KEY_PASSWORD: ""

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tome-unsigned
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/
          retention-days: 7

  # === E2E Tests Job ===
  test-e2e:
    name: E2E Tests
    runs-on: macos-14
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps webkit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: tome-unsigned
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/

      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true # E2E tests may need app to be running

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  # === Architecture Check Job ===
  check-architecture:
    name: Architecture Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check boundaries
        run: npm run check:boundaries || echo "Boundary check script not yet implemented"
