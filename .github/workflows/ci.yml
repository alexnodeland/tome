name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs opt in to more if they need it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    # Linting needs no macOS. GitHub bills macOS runners at 10x Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust lints
        # tome-app is excluded: it needs macOS system frameworks to build.
        run: cargo clippy -p tome-core -p tome-cli -p tome-testkit --all-targets -- -D warnings

      - name: Fuzz targets compile
        # `fuzz/` is its own workspace. Type-checking it here catches a target
        # that has drifted from the module it fuzzes; actually fuzzing is
        # unbounded and belongs in a scheduled run, not a per-push gate.
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Frontend types
        run: npm run check

      - name: Frontend lint and formatting
        run: npm run lint

      - name: Design token contrast and light/dark parity
        # docs/plans/15-design-system.md § "Automated contrast checking".
        # Colour is the one part of a design system that cannot be reviewed by
        # looking at it: the two failures the plan review found both looked
        # fine and neither passed 4.5:1.
        run: node scripts/check-contrast.mjs

      - name: Site builds
        run: node site/build.mjs

      - name: Release versions agree
        # Cargo.toml is the source of truth; package.json carries a copy npm
        # insists on. The bundle's CFBundleShortVersionString comes from Cargo.
        run: ./scripts/set-version.sh --check

      - name: Cask style
        # Homebrew's own linter. It refuses casks outside a tap, so the script
        # stages a throwaway one.
        run: ./scripts/check-cask.sh

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `rustsec/audit-check` was here and has been removed. It reads
      # `Cargo.lock` with no target scoping, so on 2026-07-30 — CI's first
      # real run — it failed the build on `unmaintained` advisories for
      # Tauri's Linux GTK bindings (`atk`, `atk-sys`, …), which are never
      # compiled into a macOS build. It reported **zero vulnerabilities**.
      #
      # Worse, it failed *first*, so cargo-deny, `npm audit` and the secret
      # scan were all skipped: the redundant check was gating the ones that
      # work. cargo-deny reads the same RustSec database, is scoped to
      # `aarch64-apple-darwin` in `deny.toml`, and lists its ignores
      # individually with dated reasons so a NEW unmaintained advisory still
      # fails. One advisory check, and it is the better one.
      - name: Advisories, licences, bans, sources
        uses: EmbarkStudios/cargo-deny-action@v2

      - run: npm ci
      - name: npm advisories
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-rust:
    name: Test Rust
    # Tome is macOS-only, and the path module asserts macOS conventions.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Stage the CLI sidecar
        # `bundle.externalBin` makes the CLI a sidecar, and src-tauri/build.rs
        # refuses to compile without it staged — so this has to run before
        # anything that builds tome-app.
        run: TOME_CLI_PROFILE=debug ./scripts/build-cli-sidecar.sh

      - name: Unit and integration tests
        # tome-app is included: its tests cover the `tome://` asset protocol
        # handler, the one place a string from page content becomes a
        # filesystem path. It builds here (macOS) but not in the Linux lint
        # job, which is why the clippy step above still excludes it.
        run: cargo test -p tome-core -p tome-cli -p tome-testkit -p tome-app

  test-js:
    name: Test frontend
    # jsdom-based; no macOS needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Build app
    runs-on: macos-14
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (unsigned)
        # TOME_CLI_TARGET has to match --target: Tauri looks for the sidecar
        # under the TARGET triple, and the host triple would stage a file the
        # bundler never finds.
        env:
          TOME_CLI_TARGET: aarch64-apple-darwin
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Verify the bundle
        # The app and the CLI must come from one build (S4-9). Nothing above
        # this line can see the artifact a user installs.
        run: ./scripts/verify-bundle.sh target/aarch64-apple-darwin/release/bundle/macos/Tome.app

      - uses: actions/upload-artifact@v7
        with:
          name: tome-unsigned
          path: target/aarch64-apple-darwin/release/bundle/macos/
          retention-days: 7
