name: Release

# Tag-driven. `git tag v0.1.0 && git push --tags` builds the DMG, publishes a
# release, and mirrors the cask to alexnodeland/homebrew-tap.
#
# There is NO signing and NO notarization (ADR-0006). That removes the single
# most sensitive secret a release pipeline would hold, and is why this workflow
# is short. It also means Gatekeeper blocks first launch; the cask's caveats
# carry the fix, and this workflow's release notes repeat it.
#
# **It does not touch the Homebrew tap.** `alexnodeland/homebrew-tap` bumps its
# own casks on a schedule by reading this repository's latest release, so this
# workflow needs no cross-repository credential at all — no PAT to create, hold
# or rotate. Publishing the release IS the handoff. See that repository's
# `scripts/bump.py`.
#
# > This workflow has never run. GitHub Actions is blocked at the account level
# > and the repository is private, so it fails in seconds without executing a
# > step. Until that changes, cut a release by hand with the same commands --
# > they are deliberately all in scripts/, not inlined here, so that the manual
# > path and the automated one cannot diverge.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the version
        # Cargo.toml is the source of truth; tauri.conf.json has no version key
        # and inherits it, so CFBundleShortVersionString and `tome --version`
        # cannot disagree.
        run: ./scripts/set-version.sh "${{ steps.version.outputs.value }}"

      - name: Build the DMG
        # TOME_CLI_TARGET has to match --target, or the sidecar is staged under
        # the host triple and the bundler does not find it. The CLI goes INSIDE
        # the app (S4-9) so that `brew install --cask tome` delivers both from
        # one build.
        env:
          TOME_CLI_TARGET: aarch64-apple-darwin
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify the bundle
        # The checks that every unit test passes and a broken release still
        # fails: CLI present, same architectures, same build, same version,
        # correct library paths, zap list complete.
        run: ./scripts/verify-bundle.sh target/aarch64-apple-darwin/release/bundle/macos/Tome.app

      - name: Name the artifact
        id: dmg
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"

          # A glob, not `find … | head -1`. Under `set -o pipefail` that
          # pipeline can fail on SIGPIPE when `head` closes early, and it also
          # silently picks whichever file sorted first — including a leftover
          # `rw.*.dmg` from an interrupted bundle_dmg.sh run.
          shopt -s nullglob
          dmgs=(target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "expected exactly one DMG, found ${#dmgs[@]}: ${dmgs[*]:-none}" >&2
            exit 1
          fi

          # The cask's `url` interpolates the version into this exact name, and
          # the tap's bump.py derives the asset name from that same template.
          dest="Tome-${version}.dmg"
          mv "${dmgs[0]}" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$dest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          gh release create "v${version}" "${{ steps.dmg.outputs.path }}" \
            --title "Tome ${version}" \
            --generate-notes \
            --notes "
          Install:

              brew install --cask alexnodeland/tap/tome

          Tome is **not signed by Apple** ([ADR-0006](https://github.com/alexnodeland/tome/blob/main/docs/decisions/0006-unsigned-distribution.md)), so macOS blocks the first launch. To allow it:

              xattr -dr com.apple.quarantine /Applications/Tome.app

          The \`tome\` CLI is installed alongside the app and shares its library.

          SHA256: \`${{ steps.dmg.outputs.sha256 }}\`
          "
