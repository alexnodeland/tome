name: Pages

# Build and publish the documentation site.
#
# > **This has never run.** GitHub Actions is blocked at the account level and
# > the repository is private, so every workflow here fails in ~2 seconds
# > without executing a step. The site builds locally with `node site/build.mjs`
# > and `./scripts/check.sh` gates it; this file is what will publish it the day
# > Actions is available. Judge the site by the local build until then.
#
# Two things it publishes, not one:
#
#   1. The documentation site itself.
#   2. `registry/` — the source registry, which PRD § Source Registry
#      specifies is served from the project's GitHub Pages. Anything consuming
#      the registry over HTTP reads it from here.

on:
  push:
    branches: [main]
    # Only when something the site is built from actually changed. A docs
    # deploy on every commit to `crates/` is noise, and Pages deployments
    # serialise.
    paths:
      - 'site/**'
      - 'registry/**'
      - 'public/tokens.css'
      - '.github/workflows/pages.yml'
  # Publishing a site is the kind of thing you want to be able to do on
  # purpose, not only as a side effect of a commit.
  workflow_dispatch:

concurrency:
  # Not `cancel-in-progress`: cancelling a deploy halfway leaves Pages serving
  # whichever files happened to upload. Queue instead.
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # No `npm ci`: the site build has no dependencies, deliberately. Adding
      # an install step here would make that untrue by accident the first time
      # someone reached for one.
      - name: Build the site
        run: node site/build.mjs

      # The same gate `scripts/check.sh` runs. The site's stylesheet consumes
      # the app's design tokens, so a misspelt custom property is a real defect
      # in it — and a silent one, since an unresolved `var()` falls back rather
      # than erroring.
      - name: Check design tokens
        run: node scripts/check-contrast.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job gets these, and only the deploy job needs them.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
