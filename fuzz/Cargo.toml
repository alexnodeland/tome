# Its own workspace on purpose: `libfuzzer-sys` needs a nightly toolchain and
# sanitizer instrumentation, and neither should be imposed on `cargo test`.
# The root Cargo.toml excludes this directory to match.
[workspace]

[package]
name = "tome-fuzz"
description = "Fuzz targets for Tome. See README.md."
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tome-core = { path = "../crates/tome-core" }
url = "2"

[profile.release]
debug = true

# Each target is a bin. `cargo fuzz add <name>` writes one of these; keep the
# list in step with fuzz_targets/ or `cargo fuzz list` lies.
[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_ids"
path = "fuzz_targets/model_ids.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_config"
path = "fuzz_targets/source_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "robots"
path = "fuzz_targets/robots.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_parser"
path = "fuzz_targets/html_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssrf"
path = "fuzz_targets/ssrf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sanitizer"
path = "fuzz_targets/sanitizer.rs"
test = false
doc = false
bench = false
