[package]
name = "tome-cli"
description = "Command-line interface for Tome."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tome"
path = "src/main.rs"

[dependencies]
tome-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
chrono.workspace = true
# The HTTP API (P4-009 names Axum). tokio is already in the workspace for
# the app shell; the API needs its net and signal features.
axum = "0.8"
tokio = { workspace = true, features = ["net", "signal", "rt-multi-thread"] }

[dev-dependencies]
# The fixture HTTP server, for end-to-end `tome add` tests. Dev-dependency
# only — the rule on the testkit crate itself.
tome-testkit.workspace = true
tempfile = "3"
# The CLI's JSON output is a contract; the tests parse it rather than
# string-matching, so a key moving fails loudly.
serde_json.workspace = true

[lints]
workspace = true
