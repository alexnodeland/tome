# Relevance eval set (S2-1, spec P2-019).
#
# Adding a query is one line. Fields:
#
#   id    stable identifier; the baseline is keyed by it, so RENAMING AN ID
#         reads as "one query deleted, one added" rather than as a rename
#   kind  symbol | natural | phrase | acronym | misspelling | cross-source
#   q     the query, exactly as a user would type it
#   want  documents that would be a correct top result, as `source:path`.
#         MORE THAN ONE IS ALLOWED and often right: several of these pages
#         legitimately answer the same question, and insisting on a single
#         gold document would penalise a ranker for being correct.
#
# Every label was written against the actual page content (titles, headings,
# and code) rather than from memory of what these projects document. A wrong
# label is worse than a missing query: it teaches the harness to reject a
# correct ranking.
#
# `kind` is not used for scoring. It exists so a regression can be read as
# "fuzzy matching got worse" rather than as an undifferentiated number.

