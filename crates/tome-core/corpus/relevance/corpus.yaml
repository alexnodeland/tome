# The relevance eval corpus (S2-1, spec P2-019).
#
# The documents themselves are under `pages/<source>/<path>.json`, one file per
# page, and the harness discovers them by walking that tree — there is no
# per-document entry to maintain. This file only records what cannot be derived
# from the directory: each source's category, where it came from, and under
# which licence it is redistributed.
#
# Each page file is a serialized `store::StoredPage` — exactly what
# `pipeline::pull` writes to the page store, so the eval indexes what the
# product indexes rather than an approximation of it. They were produced by
# running the real `tome pull` against the URLs below: robots.txt honoured,
# rate-limited, self-identifying user agent, one request at a time.
#
# `<path>` is `crawl::page_path_for`'s output, which is the URL path with the
# leading slash removed — so a Cargo page is `cargo/reference/manifest.html`,
# not `reference/manifest.html`, and an extensionless URL like
# `https://go.dev/doc/comment` stays extensionless. Query labels in
# `queries.yaml` are `source:path` and must match this exactly.
#
# ## Licences
#
# Redistribution rules are the same as the normalization corpus and were
# settled by SPIKE-010: only sources whose licence permits alteration and
# redistribution may be committed. These are the same six hosts already
# verified in `../normalization/input/SOURCES.md`, and no new host was added
# precisely so that no new licence review was needed.
#
# The committed files are *derived* ASTs rather than the pages as served —
# parsed, normalized, and sanitized. That is redistribution of a modified
# work, which every licence below permits.

sources:
  - id: python
    name: Python Documentation
    category: Python
    url: https://docs.python.org/
    licence: PSF-2.0
    sections: ['/3/tutorial/', '/3/library/']

  - id: cargo
    name: The Cargo Book
    category: Rust
    url: https://doc.rust-lang.org/cargo/
    licence: MIT OR Apache-2.0
    sections: ['/cargo/']

  - id: rust-std
    name: Rust Standard Library
    category: Rust
    url: https://doc.rust-lang.org/std/
    licence: MIT OR Apache-2.0
    sections: ['/std/']

  - id: node
    name: Node.js API
    category: JavaScript
    url: https://nodejs.org/api/
    licence: MIT
    # nodejs.org's robots.txt disallows /docs/ and allows /api/, which is why
    # only /api/ appears here. The crawler enforces this; the note is so a
    # future expansion does not "fix" the omission.
    sections: ['/api/']

  - id: kubernetes
    name: Kubernetes Concepts
    category: Infrastructure
    url: https://kubernetes.io/docs/concepts/
    licence: CC-BY-4.0
    sections: ['/docs/concepts/']

  - id: go
    name: Go Documentation
    category: Go
    url: https://go.dev/
    licence: CC-BY-4.0
    sections: ['/doc/']
