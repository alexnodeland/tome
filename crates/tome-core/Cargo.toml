[package]
name = "tome-core"
description = "Shared core for the Tome documentation reader: paths, config, ingestion, search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chrono.workspace = true
directories.workspace = true
ego-tree.workspace = true
regex.workspace = true
rusqlite.workspace = true
scraper.workspace = true
serde = { workspace = true }
# Not only a dev-dependency: the DB stores `icon` and `sync` as JSON in the
# frozen serde shape, so the same contract covers storage, IPC, and the API.
serde_json.workspace = true
serde_yaml_ng.workspace = true
syntect.workspace = true
tantivy.workspace = true
thiserror.workspace = true
tracing.workspace = true
# For `logging`'s `MakeWriter` impls only. The orphan rule puts them here: the
# writer type is tome-core's and the trait is tracing-subscriber's, so neither
# the CLI nor the app could implement it for us. Already in the workspace --
# both binaries depend on it -- so this adds no crate to the tree.
tracing-subscriber.workspace = true
ureq.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# Dev-dependency ONLY — the fixture server must never ship in the product.
tome-testkit.workspace = true

[lints]
workspace = true
