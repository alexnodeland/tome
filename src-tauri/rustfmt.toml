# Rust formatting configuration
# https://rust-lang.github.io/rustfmt/

# Use Rust 2021 edition formatting
edition = "2021"

# Maximum line width
max_width = 100

# Use block indentation (4 spaces)
tab_spaces = 4
hard_tabs = false

# Newlines
newline_style = "Unix"

# Imports
# Group imports: std, external, crate
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
reorder_imports = true
reorder_modules = true

# Function signatures
# Put closing paren on same line as last arg if it fits
fn_args_layout = "Tall"
# Use block indent for function args
fn_call_width = 60
fn_single_line = false

# Structs and enums
struct_lit_single_line = true
struct_variant_width = 35

# Control flow
# Put else on same line as closing brace
brace_style = "SameLineWhere"
control_brace_style = "AlwaysSameLine"

# Match expressions
match_block_trailing_comma = true
match_arm_leading_pipes = "Never"

# Comments
comment_width = 80
wrap_comments = true
normalize_comments = true
normalize_doc_attributes = true
format_code_in_doc_comments = true

# Chains
# Keep method chains readable
chain_width = 60

# Use statements
# Don't merge use statements
merge_derives = true
use_field_init_shorthand = true
use_try_shorthand = true

# Macros
format_macro_matchers = true
format_macro_bodies = true

# Strings
format_strings = false

# Attributes
# Put attributes on their own line
reorder_impl_items = true

# Trailing
trailing_comma = "Vertical"
trailing_semicolon = true

# Blank lines
blank_lines_lower_bound = 0
blank_lines_upper_bound = 1

# Force explicit returns in closures for clarity
# (Disabled - too strict for small closures)
# force_explicit_abi = true

# Where clauses
where_single_line = false
