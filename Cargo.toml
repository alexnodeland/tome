[workspace]
resolver = "2"
members = ["crates/tome-core", "crates/tome-cli", "crates/tome-testkit", "src-tauri"]
# `fuzz/` is its own workspace: `libfuzzer-sys` needs a nightly toolchain and
# sanitizer flags, and pulling it into this workspace would impose both on every
# ordinary `cargo test`. See fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexnodeland/tome"
authors = ["Alex Nodeland"]

[workspace.dependencies]
tome-core = { path = "crates/tome-core", version = "0.1.0" }
tome-testkit = { path = "crates/tome-testkit", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml_ng, not serde_yaml: upstream serde_yaml was archived
# (RUSTSEC-2024-0320, unmaintained) and this workspace's deny.toml fails on
# NEW unmaintained crates by design. The _ng fork is a maintained drop-in.
serde_yaml_ng = "0.10"
regex = "1"
# For CSS selector validation in source configs (S1-3) and the HTML parser
# (S1-7) — one dependency serving both is why it lands with the earlier ticket.
scraper = "0.27"
# scraper's tree type, needed to walk the parsed DOM (S1-7). Kept at the
# same version scraper resolves so there is exactly one tree type.
ego-tree = "0.11"
thiserror-ext = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = { version = "2", features = ["serde"] }
# Sync HTTP on purpose: the crawler is rate-limited to 2 req/s per host, so
# async buys nothing, and a sync client keeps the whole ingestion pipeline
# plain functions — no runtime threading through Tauri, the CLI, and tests.
# rustls via the default features; no system TLS.
ureq = "3"
# `bundled` compiles SQLite in rather than linking whatever macOS shipped:
# the schema uses STRICT tables (3.37+) and behaviour must not vary by OS
# point release.
rusqlite = { version = "0.40", features = ["bundled"] }
# Syntax highlighting (S1-11). Deliberately NOT the default feature set:
#   * `regex-fancy` instead of `regex-onig` — oniguruma is a C library, and
#     this workspace is otherwise pure Rust (`unsafe_code = "forbid"`, a
#     single `cargo build` with no C toolchain assumptions).
#   * no `default-themes` / `plist-load` / `yaml-load` — the reader uses
#     `ClassedHTMLGenerator`, which emits CSS classes rather than inline
#     colours, so themes are S1-12's stylesheet and light/dark switches
#     without re-highlighting. Loading syntect's theme dumps would pull
#     `plist` and `yaml-rust` in to produce colours we then throw away.
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "html",
    "regex-fancy",
] }
# Full-text search (S2-2). Adopted on SPIKE-003's measurements, not on
# reputation: 439 MB peak indexing 100k pages, 18.7 ms worst-case p95, 224 MB
# index, 3 MB idle -- every criterion passed with margin, so none of the
# fallbacks the spike spec listed (sharding, index-per-source, lazy loading)
# are needed. See docs/spikes/003-tantivy-scale.md.
#
# DEFAULT features, deliberately, unlike syntect above. The spike measured
# tantivy at its defaults, and the adoption case is those numbers; trimming
# features here would mean shipping a configuration nobody measured. Two of
# the defaults are load-bearing:
#   * `mmap` is why idle memory is 3 MB -- tantivy maps its files rather than
#     reading them into the heap (spike finding 6). Dropping it would move the
#     whole index into our RSS.
#   * `stemmer` changes which documents match, so it is a RELEVANCE decision.
#     It belongs to S2-4, scored against S2-1's eval set, not to a feature-flag
#     judgement call here. Left on because that is what was measured.
# `columnar-zstd-compression` pulls `zstd-sys`, which is C. That is not a new
# constraint: `rusqlite`'s `bundled` feature already compiles SQLite from C, so
# this workspace has always needed a C toolchain (the syntect note above
# overstates the purity).
tantivy = "0.26"

# Test-only. `similar` produces the unified diffs the golden-corpus harness
# prints; `proptest` and `tempfile` are used by tests across several crates.
similar = { version = "3", default-features = false, features = ["text"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Panicking paths are how agent-written code fails silently in production:
# an `unwrap()` on remote data becomes a crash loop. Deny them in library
# code and allow them explicitly, per-call, with a justification.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
