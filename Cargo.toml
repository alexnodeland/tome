[workspace]
resolver = "2"
members = ["crates/tome-core", "crates/tome-cli", "src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexnodeland/tome"
authors = ["Alex Nodeland"]

[workspace.dependencies]
tome-core = { path = "crates/tome-core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror-ext = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Panicking paths are how agent-written code fails silently in production:
# an `unwrap()` on remote data becomes a crash loop. Deny them in library
# code and allow them explicitly, per-call, with a justification.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
